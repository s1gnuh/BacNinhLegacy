<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Giáo án Bắc Ninh 10K</title>
<meta name="description" content="Giáo án tập luyện 10K cho Bắc Ninh Legacy Marathon 2027">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A726D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BN 10K">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="wrap">
  <header class="head">
    <div class="eyebrow">Giáo án 10 km · 19/10/2026 đến 10/1/2027</div>
    <h1>Bắc Ninh Legacy Marathon 2027</h1>
    <div class="head-row">
      <div class="count"><b class="num" id="days">83</b><span>ngày nữa đến ngày thi, Chủ nhật 10/1</span></div>
      <div class="seg" role="group" aria-label="Số buổi chạy mỗi tuần">
        <button type="button" id="m4" aria-pressed="true">4 buổi/tuần</button>
        <button type="button" id="m3" aria-pressed="false">3 buổi/tuần</button>
      </div>
    </div>
    <div>
      <div class="bar" role="progressbar" aria-label="Tiến độ giáo án" aria-valuemin="0" aria-valuemax="100" id="pbar"><i id="pfill"></i></div>
      <div class="bar-label"><span id="plabel">0 buổi đã chạy</span><span id="pkm" class="num">0 km</span></div>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Các phần của giáo án">
    <button type="button" role="tab" id="tab-overview" aria-controls="panel-overview" aria-selected="true" data-tab="overview">Tổng quan</button>
    <button type="button" role="tab" id="tab-schedule" aria-controls="panel-schedule" aria-selected="false" tabindex="-1" data-tab="schedule">Lịch tập</button>
    <button type="button" role="tab" id="tab-strava" aria-controls="panel-strava" aria-selected="false" tabindex="-1" data-tab="strava">Strava</button>
    <button type="button" role="tab" id="tab-ref" aria-controls="panel-ref" aria-selected="false" tabindex="-1" data-tab="ref">Tham khảo</button>
  </nav>

  <div class="tabpane" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview" data-src="sections/overview.html"></div>
  <div class="tabpane" id="panel-schedule" role="tabpanel" aria-labelledby="tab-schedule" data-src="sections/schedule.html" hidden></div>
  <div class="tabpane" id="panel-strava" role="tabpanel" aria-labelledby="tab-strava" data-src="sections/strava.html" hidden></div>
  <div class="tabpane" id="panel-ref" role="tabpanel" aria-labelledby="tab-ref" data-src="sections/reference.html" hidden></div>

  <p class="foot">Buổi đã chạy, lịch ngày chạy và ghi chú được lưu trong trình duyệt này.</p>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
