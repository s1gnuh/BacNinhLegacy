<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nhật ký chạy</title>
<meta name="description" content="Buổi chạy tiếp theo, tóm tắt nhanh và các giải đấu đang theo đuổi">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E2551">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nhật ký chạy">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<script>
// Đặt giao diện và quyết định màn hình chờ TRƯỚC khi vẽ, nếu không sẽ nháy.
// sessionStorage trống nghĩa là app vừa được mở lại từ đầu (đã thoát hẳn khỏi
// đa nhiệm) — chuyển qua lại giữa các tab thì không hiện nữa.
try { var t = localStorage.getItem('app-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
try { if (!sessionStorage.getItem('runn-splash')) { document.documentElement.classList.add('splash-on'); sessionStorage.setItem('runn-splash', '1'); } } catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="splash" id="splash">
  <div class="splash-card">
    <img class="splash-logo" src="icons/logo-dark.png" width="816" height="222" alt="RUNN">
    <p class="splash-slogan">run your own life</p>
  </div>
  <div class="splash-bar"><i></i></div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="wrap">
  <header class="head">
    <div class="app-head">
      <picture class="app-logo">
        <source srcset="icons/logo-dark.png" media="(prefers-color-scheme: dark)">
        <img src="icons/logo.png" width="816" height="222" alt="RUNN">
      </picture>
      <div class="app-head-text">
        <h1 id="dash-greet">Chào buổi sáng</h1>
        <div class="eyebrow" id="dash-date"></div>
      </div>
    </div>
  </header>

  <section class="next" id="next" aria-live="polite"></section>

  <a class="panel qstat-link" href="stats.html">
    <div class="qstat-row" id="qstat-row"></div>
    <span class="qstat-cta">Xem thống kê đầy đủ ›</span>
  </a>

  <section class="panel quote-card">
    <div class="quote-head"><span class="eyebrow">Lời nhắc</span><button type="button" class="lnk" id="quote-next">Câu khác</button></div>
    <blockquote id="quote-q"></blockquote>
    <cite id="quote-a"></cite>
  </section>

  <section>
    <div class="sec-head"><h2 class="sec-title">Các giải đấu</h2><button type="button" class="btn-sm" id="race-add-toggle">+ Tạo giải mới</button></div>
    <form id="race-form" class="race-form panel" hidden>
      <input type="hidden" id="race-edit-id" value="">
      <label class="fld wide"><span>Tên giải</span><input type="text" id="race-name" required placeholder="Ví dụ: Giải chạy Hà Nội 2027"></label>
      <div class="race-form-row">
        <label class="fld"><span>Ngày thi</span><input type="date" id="race-date" required></label>
        <label class="fld"><span>Cự ly (km)</span><input type="number" id="race-km" min="0" step="any" value="10"></label>
      </div>
      <label class="fld" id="race-template-wrap"><span>Chọn giáo án theo cấp độ</span>
        <select id="race-template"></select>
      </label>
      <p class="hint" id="race-template-desc"></p>
      <div class="panel-actions">
        <button type="submit" class="btn-sm primary" id="race-submit">Tạo giải</button>
        <button type="button" class="lnk" id="race-cancel" hidden>Huỷ</button>
      </div>
    </form>
    <div class="race-list" id="race-list"></div>
  </section>

  <p class="foot">Dữ liệu được lưu trong trình duyệt này.</p>
</div>

<nav class="navbar" id="navbar" aria-label="Menu chính"></nav>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="js/core.js"></script>
<script src="js/nav.js"></script>
<script src="js/templates.js"></script>
<script src="js/blocks.js"></script>
<script src="js/races.js"></script>
<script src="js/runlog.js"></script>
<script src="js/sync.js"></script>
<script src="js/predict.js"></script>
<script src="js/adapt.js"></script>
<script src="js/migrate.js"></script>
<script src="js/notify.js"></script>
<script src="quotes.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
