<section class="panel" id="strava">
  <h2>Ảnh Strava</h2>
  <p class="hint">Tải ảnh chụp màn hình hoạt động Strava sau mỗi buổi chạy. Ảnh có ngày trùng một buổi trong giáo án sẽ được gắn vào buổi đó và buổi đó tự được đánh dấu đã chạy. Ảnh chỉ lưu trong trình duyệt này.</p>
  <label class="drop" id="sv-drop" for="sv-file"><strong>Chọn ảnh hoặc kéo thả vào đây</strong><span>PNG hoặc JPG, chọn được nhiều ảnh cùng lúc</span><input class="sr" type="file" id="sv-file" accept="image/*" multiple></label>
  <div class="panel-actions"><span id="sv-sum" class="hint"></span><button type="button" class="lnk" id="sv-read-all" hidden>Đọc số liệu của các ảnh còn trống bằng Claude</button></div>
  <p class="hint" id="sv-note"></p>
  <div class="lg-list" id="sv-list"></div>
</section>
