<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nhật ký & ảnh – Nhật ký chạy</title>
<meta name="theme-color" content="#0E2551">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="head">
    <div class="eyebrow" id="log-eyebrow"></div>
    <h1>Nhật ký &amp; ảnh</h1>
    <p class="hint" id="log-storage"></p>
  </header>

  <section>
    <div class="cal-head">
      <button type="button" id="log-prev" class="cal-nav" aria-label="Tháng trước">‹</button>
      <h2 id="log-cal-title"></h2>
      <button type="button" id="log-next" class="cal-nav" aria-label="Tháng sau">›</button>
    </div>
    <div class="cal-dow">
      <span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span>
    </div>
    <div class="cal" id="log-cal" role="grid"></div>
  </section>

  <section id="log-day" hidden></section>
</div>

<nav class="navbar" id="navbar" aria-label="Menu chính"></nav>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="js/core.js"></script>
<script src="js/nav.js"></script>
<script src="js/runlog.js"></script>
<script src="js/log-page.js"></script>
</body>
</html>
