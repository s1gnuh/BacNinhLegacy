<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nhập nhanh – Nhật ký chạy</title>
<meta name="description" content="Nhập nhanh một buổi chạy: km, pace, thời gian, hoặc chọn ảnh Strava để tự điền">
<meta name="theme-color" content="#0E2551">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<script>try { var t = localStorage.getItem('app-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="head">
    <div class="eyebrow" id="log-eyebrow"></div>
    <h1>Nhập nhanh</h1>
    <p class="hint" id="log-storage"></p>
  </header>

  <section class="panel qe" id="qe">
    <h2 id="qe-title">Buổi chạy mới</h2>

    <label class="drop qe-drop" id="qe-drop" for="qe-file">
      <strong id="qe-drop-t">Chọn ảnh Strava để tự điền</strong>
      <span id="qe-drop-s">Chọn nhiều ảnh cùng lúc để nhập hàng loạt. Cũng kéo thả hoặc dán (Ctrl+V) được. Không bắt buộc.</span>
      <input class="sr" type="file" id="qe-file" accept="image/*" multiple>
    </label>

    <div class="qe-key" id="qe-key" hidden>
      <label class="fld"><span>Gemini API key (để tự điền từ ảnh)</span>
        <input type="password" id="qe-key-in" autocomplete="off" spellcheck="false" placeholder="AIza...">
      </label>
      <button type="button" class="btn-sm primary" id="qe-key-save">Lưu key</button>
      <p class="hint">Lấy miễn phí ở <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>. Key chỉ lưu trong trình duyệt này; đổi model hoặc xóa key ở <a href="settings.html">Cài đặt</a>.</p>
    </div>

    <div class="qe-photo" id="qe-photo" hidden>
      <img id="qe-img" alt="Ảnh đã chọn">
      <div class="qe-photo-side">
        <p class="hint" id="qe-ai" role="status"></p>
        <button type="button" class="btn-sm" id="qe-clear">Bỏ ảnh</button>
      </div>
    </div>

    <div class="qe-grid">
      <label class="fld"><span>Ngày</span><input type="date" id="qe-date"></label>
      <label class="fld"><span>Loại</span>
        <select id="qe-kind">
          <option value="run">Chạy</option>
          <option value="walk">Đi bộ</option>
          <option value="other">Khác</option>
        </select>
      </label>
      <label class="fld" id="qe-shoe-wrap" hidden><span>Giày</span><select id="qe-shoe"></select></label>
      <label class="fld"><span>Khoảng cách (km)</span><input type="text" id="qe-km" inputmode="decimal" autocomplete="off" placeholder="5,00"></label>
      <label class="fld"><span>Pace (phút/km)</span><input type="text" id="qe-pace" inputmode="numeric" autocomplete="off" placeholder="6:30"></label>
      <label class="fld"><span>Thời gian</span><input type="text" id="qe-time" inputmode="numeric" autocomplete="off" placeholder="32:30"></label>
      <label class="fld wide"><span>Chú thích</span><input type="text" id="qe-note" autocomplete="off" placeholder="Cảm giác, thời tiết, đau mỏi..."></label>
    </div>
    <p class="hint" id="qe-calc"></p>
    <p class="hint" id="qe-shoe-hint"></p>

    <label class="qe-link" id="qe-link" hidden>
      <input type="checkbox" id="qe-link-cb" checked>
      <span id="qe-link-t"></span>
    </label>

    <div class="lg-actions">
      <button type="button" class="btn-sm primary" id="qe-save">Lưu buổi chạy</button>
      <button type="button" class="btn-sm" id="qe-cancel" hidden>Hủy sửa</button>
    </div>
  </section>

  <section class="panel qb" id="qb" hidden>
    <div class="sec-head"><h2>Nhập hàng loạt</h2><span class="hint" id="qb-sum"></span></div>
    <p class="hint" id="qb-note"></p>
    <div class="qb-list" id="qb-list"></div>
    <label class="fld qb-shoe" id="qb-shoe-wrap" hidden><span>Giày cho các buổi chạy / đi bộ này</span><select id="qb-shoe"></select></label>
    <label class="qe-link"><input type="checkbox" id="qb-link" checked><span>Đánh dấu xong buổi tương ứng trong Lịch tập theo ngày</span></label>
    <div class="lg-actions">
      <button type="button" class="btn-sm primary" id="qb-save">Lưu tất cả</button>
      <label class="btn-sm" for="qb-file">+ Thêm ảnh</label>
      <input class="sr" type="file" id="qb-file" accept="image/*" multiple>
      <button type="button" class="btn-sm" id="qb-cancel">Hủy</button>
    </div>
  </section>

  <section id="qe-recent-wrap" hidden>
    <div class="sec-head"><h2 class="sec-title">Gần đây</h2></div>
    <div class="cal-cards" id="qe-recent"></div>
    <button type="button" class="btn-sm qe-more" id="qe-more" hidden>Xem thêm</button>
  </section>
</div>

<nav class="navbar" id="navbar" aria-label="Menu chính"></nav>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="js/core.js"></script>
<script src="js/nav.js"></script>
<script src="js/templates.js"></script>
<script src="js/blocks.js"></script>
<script src="js/runlog.js"></script>
<script src="js/sync.js"></script>
<script src="js/shoes.js"></script>
<script src="js/vision.js"></script>
<script src="js/log-page.js"></script>
</body>
</html>
