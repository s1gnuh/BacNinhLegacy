<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Thống kê – Nhật ký chạy</title>
<meta name="description" content="Km, streak, PR cá nhân, mục tiêu và phân tích xu hướng tập luyện">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A726D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nhật ký chạy">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="wrap">
  <header class="head">
    <div class="eyebrow" id="st-eyebrow"></div>
    <h1>Thống kê</h1>
  </header>

  <section class="stat-grid" id="stat-grid"></section>

  <section>
    <h2 class="sec-title">Thành tích tốt nhất</h2>
    <div class="pr-grid" id="pr-grid"></div>
  </section>

  <section class="panel" id="analysis">
    <h2>Phân tích xu hướng</h2>
    <div class="chart" id="trend-chart" role="img" aria-label="Biểu đồ km 8 tuần gần nhất"></div>
    <div id="analysis-notes"></div>
  </section>

  <section class="panel">
    <div class="sec-head"><h2>Mục tiêu</h2><button type="button" class="btn-sm" id="goal-add-toggle">+ Thêm mục tiêu</button></div>
    <form id="goal-form" class="goal-form" hidden>
      <label class="fld"><span>Loại mục tiêu</span>
        <select id="goal-type">
          <option value="weekly_km">Km mỗi tuần</option>
          <option value="weekly_sessions">Số buổi mỗi tuần</option>
          <option value="monthly_km">Km mỗi tháng</option>
          <option value="pr_target">Mục tiêu thành tích (giây)</option>
        </select>
      </label>
      <label class="fld"><span id="goal-target-label">Mục tiêu</span><input type="number" id="goal-target" min="0" step="any" required></label>
      <label class="fld" id="goal-dist-wrap" hidden><span>Cự ly (km)</span><input type="number" id="goal-dist" min="0" step="any" value="10"></label>
      <button type="submit" class="btn-sm primary">Lưu mục tiêu</button>
    </form>
    <div id="goal-list"></div>
  </section>

  <p class="foot">Số liệu được tính từ nhật ký chạy lưu trong trình duyệt này.</p>
</div>

<nav class="navbar" id="navbar" aria-label="Menu chính"></nav>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="js/core.js"></script>
<script src="js/nav.js"></script>
<script src="js/templates.js"></script>
<script src="js/blocks.js"></script>
<script src="js/races.js"></script>
<script src="js/runlog.js"></script>
<script src="js/goals.js"></script>
<script src="js/migrate.js"></script>
<script src="js/stats-page.js"></script>
</body>
</html>
